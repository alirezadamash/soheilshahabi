<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #0a0a12;
      color: #fff;
    }

    /* Full-page background with Unsplash image */
    .bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 8, 20, 0.55) 0%, rgba(12, 10, 30, 0.75) 100%),
        url('https://images.unsplash.com/photo-1464802686167-b939a6910659?auto=format&fit=crop&w=1920&q=85')
          center / cover no-repeat;
      z-index: 0;
      transform: scale(1.05);
      animation: subtleZoom 28s ease-in-out infinite alternate;
    }

    @keyframes subtleZoom {
      from { transform: scale(1.05); }
      to   { transform: scale(1.12); }
    }

    /* Soft floating particles (stars) */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle var(--dur) ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.4); }
    }

    /* Glass card */
    .card {
      position: relative;
      z-index: 10;
      width: min(92vw, 520px);
      padding: 2.75rem 2rem 2.5rem;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      text-align: center;
      animation: cardIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.1);
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.35rem);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.6rem;
      background: linear-gradient(120deg, #fff 30%, #c7d2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 2.1rem;
      line-height: 1.6;
    }

    /* Countdown grid */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .unit {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 1rem 0.4rem 0.85rem;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .unit:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.12);
    }

    .unit .num {
      font-size: clamp(1.6rem, 4.5vw, 2.15rem);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: #fff;
      line-height: 1.1;
      transition: color 0.3s ease;
    }

    .unit .label {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 0.35rem;
      letter-spacing: 0.02em;
    }

    /* Progress bar under countdown */
    .progress-wrap {
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.75rem;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #818cf8, #c084fc, #f472b6);
      transition: width 1s linear;
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.5);
    }

    .footer-text {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
    }

    .footer-text a {
      color: rgba(199, 210, 254, 0.9);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .footer-text a:hover {
      border-bottom-color: rgba(199, 210, 254, 0.6);
    }

    /* Decorative glow behind card */
    .glow {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(129, 140, 248, 0.35) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      filter: blur(40px);
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { opacity: 0.55; transform: translate(-50%, -50%) scale(0.95); }
      to   { opacity: 0.9;  transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card {
        padding: 2.1rem 1.35rem 2rem;
        border-radius: 22px;
      }
      .countdown {
        gap: 0.5rem;
      }
      .unit {
        padding: 0.85rem 0.25rem 0.7rem;
        border-radius: 12px;
      }
      .unit .label {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="stars" id="stars"></div>
  <div class="glow"></div>

  <div class="card">
    <div class="badge">Coming Soon</div>

    <div class="countdown" id="countdown">
      <div class="unit">
        <div class="num" id="days">00</div>
        <div class="label">Days</div>
      </div>
      <div class="unit">
        <div class="num" id="hours">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="unit">
        <div class="num" id="minutes">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="unit">
        <div class="num" id="seconds">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progress"></div>
    </div>
  </div>

  <script>
    // Target date: 10 days from now (you can change this)
    const TARGET = new Date();
    TARGET.setDate(TARGET.getDate() + 10);
    TARGET.setHours(23, 59, 59, 0); // end of that day

    // For demo progress we also store the start (now)
    const START = new Date();

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function update() {
      const now = new Date();
      const diff = TARGET - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        document.getElementById('progress').style.width = '100%';
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = pad(d);
      document.getElementById('hours').textContent = pad(h);
      document.getElementById('minutes').textContent = pad(m);
      document.getElementById('seconds').textContent = pad(s);

      // Progress bar (from start to target)
      const total = TARGET - START;
      const elapsed = now - START;
      const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
      document.getElementById('progress').style.width = pct + '%';
    }

    // Stars generator
    function createStars() {
      const container = document.getElementById('stars');
      const count = 55;
      for (let i = 0; i < count; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
        star.style.animationDelay = (Math.random() * 5) + 's';
        star.style.width = star.style.height = (1 + Math.random() * 2.5) + 'px';
        container.appendChild(star);
      }
    }

    createStars();
    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
